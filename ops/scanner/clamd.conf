Foreground yes
User clamav
LocalSocket /run/clamav/clamd.ctl
LocalSocketMode 660
FixStaleSocket yes
TCPSocket 3311
TCPAddr 127.0.0.1
DatabaseDirectory /var/lib/clamav
TemporaryDirectory /tmp
LogFile /var/log/clamav/iila-clamd.log
LogTime yes
LogClean no
LogVerbose no
MaxThreads 2
MaxQueue 8
StreamMaxLength 4M
MaxFileSize 4M
MaxScanSize 16M
MaxRecursion 8
MaxFiles 64
MaxScanTime 5000
AlertExceedsMax yes
SelfCheck 300
