foreground = yes
pid =
client = no
sslVersionMin = TLSv1.2
socket = l:TCP_NODELAY=1
socket = r:TCP_NODELAY=1

[iila-clamav]
accept = 0.0.0.0:3310
connect = 127.0.0.1:3311
cert = /etc/iila-scanner/server.pem
key = /etc/iila-scanner/server.key
CAfile = /etc/iila-scanner/client-trust.pem
verifyChain = yes
verifyPeer = yes
requireCert = yes
TIMEOUTconnect = 5
TIMEOUTbusy = 15
TIMEOUTidle = 20
TIMEOUTclose = 0
